name: 20 - Job Outputs

on: workflow_dispatch

jobs:
  produce:
    runs-on: ubuntu-latest

    # STEP 2 of the chain: promote step outputs to JOB outputs.
    outputs:
      version  : ${{ steps.meta.outputs.version }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
      name     : ${{ steps.data.outputs.name }}
      age      : ${{ steps.data.outputs.age }}

    steps:
      # STEP 1 of the chain: write to the special $GITHUB_OUTPUT file.
      - name: Compute some metadata
        id: meta                       # <- the id is mandatory
        run: |
          VERSION="2.1.${{ github.run_number }}"
          echo "version=$VERSION"            >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          echo "Computed version $VERSION"

      - name: Compute some metadata2
        id: data                       # <- the id is mandatory
        run: |
          NAME="Test"
          AGE="40"
          echo "name=$NAME"  >> "$GITHUB_OUTPUT"
          echo "age=$AGE"    >> "$GITHUB_OUTPUT"

      - name: Accessing output from another step
        run: |
          echo "    Step version  :" ${{ steps.meta.outputs.version }};
          echo "    Step timestamp:" ${{ steps.meta.outputs.timestamp }}
          echo "    Step name     :" ${{ steps.data.outputs.name }}
          echo "    Step age      :" ${{ steps.data.outputs.age }}
  
  consumer:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - name: Accessing output from another Job
        run : |
          echo "    Job version  :" ${{ needs.produce.outputs.version }};
          echo "    Job timestamp:" ${{ needs.produce.outputs.timestamp }}
          echo "    Job name     :" ${{ needs.produce.outputs.name }}
          echo "    Job age      :" ${{ needs.produce.outputs.age }}
  
          
      
  
    
  
